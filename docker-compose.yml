services:
  db:
    image: postgres:18
    restart: always
    env_file:
      - ./config/.env.database
    volumes:
      - ./data:/var/lib/postgres/data

  backend:
    build: ./backend
    env_file:
      - ./config/.env.backend
    volumes:
      - ./backend:/app
    depends_on:
      - db

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt
    environment:
      - DOMAIN=api.crosscurrent.ae
      - CERTBOT_EMAIL=adi@eyu.ae
      - CERTBOT_STAGING=false
    depends_on:
      - backend

