services:
  db:
    image: postgres:18
    restart: always
    env_file:
      - ./config/.env.database
    volumes:
      - ./data:/var/lib/postgresql/data
    # ports:
      # - 5432

  backend:
    build: ./backend
    env_file:
      - ./config/.env.backend
    # ports:
      # - 3000:3000
    volumes:
      - ./backend:/app
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
    depends_on:
      - backend

  # frontend:
  #   build: ./frontend
  #   env_file:
  #     - .config/.env.frontend
  #   ports:
  #     - 5173:5173
