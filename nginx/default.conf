server {
    listen 443 ssl;
    http2 on;
    server_name api.crosscurrent.ae;

    ssl_certificate /etc/letsencrypt/live/default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/default/privkey.pem;

    # Video uploads to the public bucket allow up to 1GB.
    client_max_body_size 1024m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Uploaded videos are stored on the host (backend/uploads/videos) and
    # served straight from disk, with Range support for seeking/resume.
    location /uploads/videos/ {
        alias /usr/share/nginx/uploads/videos/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
    }

    location / {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        # Stream large video uploads straight to the backend instead of
        # buffering the whole request body on nginx's disk first.
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support (/ws/watch: video watch-progress)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}